service: resume-builder-api

frameworkVersion: '4'

useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  profile: personal
  memorySize: 1024
  timeout: 30
  environment:
    NODE_ENV: ${self:provider.stage}
    DATABASE_URL: ${env:DATABASE_URL}
    DIRECT_URL: ${env:DIRECT_URL}
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_KEY: ${env:SUPABASE_KEY}
    SUPABASE_SERVICE_KEY: ${env:SUPABASE_SERVICE_KEY}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
    JWT_SECRET: ${env:JWT_SECRET}
    FRONTEND_URL: ${env:FRONTEND_URL}
    LOG_LEVEL: ${env:LOG_LEVEL}
    PORT: ${env:PORT}
    # AI Import Configuration (optional - only needed for AI import feature)
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    AI_MODEL: ${env:AI_MODEL, 'gpt-4o-mini'}
    AI_TIMEOUT: ${env:AI_TIMEOUT, '20000'}
    AI_MAX_RETRIES: ${env:AI_MAX_RETRIES, '2'}
    MAX_FILE_SIZE: ${env:MAX_FILE_SIZE, '10485760'}
    IMPORT_RATE_LIMIT: ${env:IMPORT_RATE_LIMIT, '5'}
    IMPORT_RATE_WINDOW: ${env:IMPORT_RATE_WINDOW, '3600000'}
    CACHE_TTL: ${env:CACHE_TTL, '3600000'}
  httpApi:
    cors:
      allowedOrigins:
        - https://resume-builder-seven-mu.vercel.app
        - https://resumebuildr.org
        - https://www.resumebuildr.org
        - http://localhost:3000
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowCredentials: false
      maxAge: 6000
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'

functions:
  auth:
    handler: dist/handlers/auth.handler
    events:
      - httpApi:
          path: /auth/{proxy+}
          method: ANY
      - httpApi:
          path: /auth
          method: ANY

  users:
    handler: dist/handlers/users.handler
    events:
      - httpApi:
          path: /users/{proxy+}
          method: ANY
      - httpApi:
          path: /users
          method: ANY

  resumes:
    handler: dist/handlers/resumes.handler
    events:
      - httpApi:
          path: /resumes/{proxy+}
          method: ANY
      - httpApi:
          path: /resumes
          method: ANY

  versions:
    handler: dist/handlers/versions.handler
    events:
      - httpApi:
          path: /resumes/{resumeId}/versions/{proxy+}
          method: ANY
      - httpApi:
          path: /resumes/{resumeId}/versions
          method: ANY

  sharing:
    handler: dist/handlers/sharing.handler
    events:
      - httpApi:
          path: /resumes/{id}/share
          method: ANY
      - httpApi:
          path: /resumes/{id}/analytics
          method: GET
      - httpApi:
          path: /public/{slug}
          method: GET

  health:
    handler: dist/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: GET

  exportPdf:
    handler: dist/handlers/export.handler
    memorySize: 2048 # Chromium needs more memory
    timeout: 30 # Generating PDF might take a few seconds
    events:
      - httpApi:
          path: /resumes/export
          method: POST

  importAI:
    handler: dist/handlers/import-ai.handler
    memorySize: 2048 # AI parsing and file processing need more memory
    timeout: 30 # AI calls can take 13-25 seconds
    events:
      - httpApi:
          path: /resumes/import-ai
          method: POST
      - httpApi:
          path: /resumes/import-ai/status
          method: GET

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: ${self:provider.environment.PORT}
    noPrependStageInUrl: true

package:
  patterns:
    # Exclude unnecessary Prisma engine binaries (keep only rhel for Lambda)
    - '!node_modules/.prisma/client/libquery_engine-darwin*'
    - '!node_modules/.prisma/client/libquery_engine-debian*'
    - '!node_modules/.prisma/client/libquery_engine-linux*'
    - '!node_modules/.prisma/client/libquery_engine-windows*'
    - 'node_modules/.prisma/client/libquery_engine-rhel-*'
    - '!node_modules/prisma/libquery_engine-*'
    - '!node_modules/@prisma/engines/**'
    # Exclude WASM engine (not needed for Node.js Lambda)
    - '!node_modules/.prisma/client/query_engine_bg.wasm'
    # Exclude test files and development artifacts
    - '!tests/**'
    - '!**/*.test.ts'
    - '!**/*.test.js'
    - '!.git/**'
    - '!.github/**'
    - '!*.md'
    - '!.env*'
    # Ensure chromium is included
    - 'node_modules/@sparticuz/chromium/**'
