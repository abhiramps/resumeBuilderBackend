service: resume-builder-api

frameworkVersion: '4'

useDotenv: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    exclude:
      - 'aws-sdk'
    external:
      - '@sparticuz/chromium'
    target: node22
    platform: node

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  profile: personal
  memorySize: 1024
  timeout: 30
  environment:
    NODE_ENV: ${self:provider.stage}
    DATABASE_URL: ${env:DATABASE_URL}
    DIRECT_URL: ${env:DIRECT_URL}
    SUPABASE_URL: ${env:SUPABASE_URL}
    SUPABASE_KEY: ${env:SUPABASE_KEY}
    SUPABASE_SERVICE_KEY: ${env:SUPABASE_SERVICE_KEY}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
    JWT_SECRET: ${env:JWT_SECRET}
    FRONTEND_URL: ${env:FRONTEND_URL}
    LOG_LEVEL: ${env:LOG_LEVEL}
    PORT: ${env:PORT}
  httpApi:
    cors:
      allowedOrigins:
        - https://resume-builder-seven-mu.vercel.app
        - https://resumebuildr.org
        - https://www.resumebuildr.org
        - http://localhost:3000
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowCredentials: false
      maxAge: 6000
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'

functions:
  auth:
    handler: src/handlers/auth.handler
    events:
      - httpApi:
          path: /auth/{proxy+}
          method: ANY
      - httpApi:
          path: /auth
          method: ANY

  users:
    handler: src/handlers/users.handler
    events:
      - httpApi:
          path: /users/{proxy+}
          method: ANY
      - httpApi:
          path: /users
          method: ANY

  resumes:
    handler: src/handlers/resumes.handler
    events:
      - httpApi:
          path: /resumes/{proxy+}
          method: ANY
      - httpApi:
          path: /resumes
          method: ANY

  versions:
    handler: src/handlers/versions.handler
    events:
      - httpApi:
          path: /resumes/{resumeId}/versions/{proxy+}
          method: ANY
      - httpApi:
          path: /resumes/{resumeId}/versions
          method: ANY

  sharing:
    handler: src/handlers/sharing.handler
    events:
      - httpApi:
          path: /resumes/{id}/share
          method: ANY
      - httpApi:
          path: /resumes/{id}/analytics
          method: GET
      - httpApi:
          path: /public/{slug}
          method: GET

  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: GET

  exportPdf:
    handler: src/handlers/export.handler
    memorySize: 3008 # Chromium needs more memory (max for non-provisioned)
    timeout: 30 # Generating PDF might take a few seconds
    ephemeralStorageSize: 2048 # Increase tmp storage for Chromium extraction
    layers:
      - arn:aws:lambda:ap-south-1:407800164427:layer:chromium-sparticuz:2
    events:
      - httpApi:
          path: /resumes/export
          method: POST

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: ${self:provider.environment.PORT}
    noPrependStageInUrl: true

package:
  individually: true
  patterns:
    # Exclude test files and development artifacts
    - '!tests/**'
    - '!**/*.test.ts'
    - '!**/*.test.js'
    - '!.git/**'
    - '!.github/**'
    - '!*.md'
    - '!.env*'
